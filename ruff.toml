# Minimal ruff configuration

target-version = "py310"
line-length = 100

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings  
    "F",    # pyflakes
    "I",    # isort
]

ignore = [
    "E501",  # Line too long (handled by formatter)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"examples/*.py" = ["T201"]
"statistical_analysis.py" = ["T201"]
