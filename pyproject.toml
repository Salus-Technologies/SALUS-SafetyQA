[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salus-safetyqa"
version = "1.0.0"
description = "SALUS-SafetyQA: A comprehensive benchmark for evaluating AI systems on construction safety knowledge"
readme = "README.md"
license = {text = "CC-BY-4.0"}
authors = [
    {name = "Alex Jacobs", email = "alex@salussafety.io"},
    {name = "Dany Ayvazov"},
]
maintainers = [
    {name = "Alex Jacobs", email = "alex@salussafety.io"},
]
keywords = [
    "construction safety",
    "benchmark",
    "evaluation",
    "safety AI",
    "question answering",
    "retrieval augmented generation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-ai>=0.0.13",
    "aiohttp>=3.9.0",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "types-pyyaml",
    "types-requests",
]
viz = [
    "plotly>=5.15.0",
    "pandas>=2.0.0",
]
all = ["salus-safetyqa[dev,viz]"]

[project.urls]
Homepage = "https://salussafety.io"
Documentation = "https://ai.salussafety.io/research"
Repository = "https://github.com/Salus-Technologies/SALUS-SafetyQA"
"Bug Tracker" = "https://github.com/Salus-Technologies/SALUS-SafetyQA/issues"
"White Paper" = "https://ai.salussafety.io/research"

[project.scripts]
salus-evaluate = "evaluate_benchmark:cli_main"
salus-analyze = "statistical_analysis:main"

[tool.setuptools]
py-modules = ["evaluate_benchmark", "statistical_analysis"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.md"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
exclude = [
    "benchmark_results/",
    "build/",
    "dist/",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=.",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--asyncio-mode=auto",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/benchmark_results/*",
    "setup.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
